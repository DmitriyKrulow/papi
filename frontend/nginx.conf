# nginx config for the PAPI frontend container.
# Serves the built SPA and reverse-proxies API calls to the backend service.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large file uploads (asset documents/photos, Excel imports)
    client_max_body_size 100M;

    # API -> FastAPI backend (service name "backend" on the compose network)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Swagger / OpenAPI (optional, handy in non-prod)
    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build files (assets/index-<hash>.js) are safe to cache forever.
    # Matched by extension, NOT by the "/assets/" prefix: /assets/... is also a
    # client-side route (assets list/detail pages), and caching those HTML
    # responses as "immutable" would pin a stale app shell in the browser.
    location ~* ^/assets/.+\.(?:js|css|map|svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The app shell must always be revalidated, otherwise a redeploy leaves
    # clients loading JS chunks that no longer exist on the server.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA routing: serve index.html for any path that is not a real file.
    # No "$uri/" here on purpose: Vite emits a real "assets" directory, which
    # would otherwise shadow the /assets route and answer 403/404 on refresh.
    location / {
        try_files $uri /index.html;
    }
}
