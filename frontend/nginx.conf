# nginx config for the PAPI frontend container.
# Serves the built SPA and reverse-proxies API calls to the backend service.
#
# This is the nginx of the deployment: the container is the only service that
# publishes a public port, so the whole app (SPA + API) is reachable through it.
# The file is bind-mounted read-only in docker-compose.yml, so an edit only
# needs `docker compose restart frontend` - no image rebuild.
#
# Host-nginx equivalent (only if you keep nginx on the host instead):
# nginx/inventory-system.conf

server {
    listen 80;
    listen      [::]:80;

    # Public names from the old papi.conf. "_" keeps direct IP/localhost access
    # working (this is the only server block, so it is also the default one).
    server_name мастербайт.рф www.мастербайт.рф _;

    root /usr/share/nginx/html;
    index index.html;

    # Never list directory contents (parity with papi.conf: autoindex off)
    autoindex off;
    charset utf-8;

    # Allow large file uploads (asset documents/photos, Excel imports)
    client_max_body_size 100M;

    # API -> FastAPI backend (service name "backend" on the compose network).
    # The /api prefix is preserved on purpose: routers are mounted with
    # prefix="/api" (backend/src/infrastructure/main.py), so proxy_pass must NOT
    # end with a slash - "http://backend:8000/" would strip it and 404 everything.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # API responses must not be cached by clients or intermediaries
        # (papi.conf had: Cache-Control no-store)
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # "/api" without the trailing slash is not matched by "location /api/"
    location = /api {
        return 301 /api/;
    }

    # Swagger / OpenAPI (optional, handy in non-prod)
    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build files (assets/index-<hash>.js) are safe to cache forever.
    # Matched by extension, NOT by the "/assets/" prefix: /assets/... is also a
    # client-side route (assets list/detail pages), and caching those HTML
    # responses as "immutable" would pin a stale app shell in the browser.
    location ~* ^/assets/.+\.(?:js|css|map|svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The app shell must always be revalidated, otherwise a redeploy leaves
    # clients loading JS chunks that no longer exist on the server.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA routing: serve index.html for any path that is not a real file.
    # No "$uri/" here on purpose: Vite emits a real "assets" directory, which
    # would otherwise shadow the /assets route and answer 403/404 on refresh.
    location / {
        try_files $uri /index.html;
    }
}
