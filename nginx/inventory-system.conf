# Nginx конфиг для системы учета активов
# Размещается в /etc/nginx/sites-available/ (Ubuntu)
# Или в /etc/nginx/conf.d/

server {
    listen 80;
    server_name мастербайт.рф www.мастербайт.рф;

    # Корневая директория фронтенда
    root /var/www/papi/frontend/dist;
    index index.html;

    #charset koi8-r;
    #access_log /var/log/nginx/papi.access.log;

    # ============================================
    # КРИТИЧНО: Возвращаем JSON вместо HTML-страницы
    # Когда токен истекает, бэкенд возвращает 401/403,
    # но nginx может подменить это на свою страницу ошибки.
    # Этот блок гарантирует, что фронтенд получит JSON.
    # ============================================

    # Для API routes — всегда возвращаем JSON, даже при ошибках
    location /api/ {
        proxy_pass http://127.0.0.1:8888;  # FastAPI бэкенд
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Кэширование API не нужно
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        
        # Возвращаем JSON даже при ошибках бэкенда
        proxy_intercept_errors on;
        error_page 401 403 = @api_auth_error;
    }

    # Статика фронтенда (js, css, images)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Все остальные запросы — отдаем index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Настройка страниц ошибок — возвращаем JSON вместо HTML
    # Критично: если токен истекает, бэкенд возвращает 401/403,
    # но nginx может вернуть свою страницу ошибки.
    # Этот блок гарантирует, что фронтенд получит JSON.
    
    # Если nginx сам возвращает 403/401 (не бэкенд),
    # перенаправляем на API, который вернёт JSON
    error_page 403 = @forbidden;
    error_page 401 = @unauthorized;

    location @forbidden {
        default_type application/json;
        return 403 '{"detail":"Доступ запрещен. Возможно, сессия истекла. Перезагрузите страницу."}';
    }

    location @unauthorized {
        default_type application/json;
        return 401 '{"detail":"Не авторизован. Возможно, сессия истекла. Перезагрузите страницу."}';
    }

    # SSL (раскомментировать при использовании HTTPS)
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/мастербайт.рф/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/мастербайт.рф/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
}
