# Nginx config for asset management system
# Place in /etc/nginx/sites-available/ (Ubuntu) or /etc/nginx/conf.d/

server {
    listen 80;
    server_name мастербайт.рф www.мастербайт.рф;

    # Frontend root directory
    root /opt/papi/frontend/dist;
    index index.html;

    # ============================================
    # API routes - proxy to FastAPI backend
    # ============================================
    location /api/ {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # No caching for API
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # Return JSON even on backend errors
        proxy_intercept_errors on;
        error_page 401 403 = @api_auth_error;
    }

    # Frontend static assets (js, css, images)
    # Cache files for 1 year, but do not aggressively cache the directory itself
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ =404;
    }

    # SPA routing - serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Return JSON instead of HTML on errors
    error_page 403 = @forbidden;
    error_page 401 = @unauthorized;

    location @forbidden {
        default_type application/json;
        return 403 '{"detail":"Access denied. Session may have expired. Reload the page."}';
    }

    location @unauthorized {
        default_type application/json;
        return 401 '{"detail":"Unauthorized. Session may have expired. Reload the page."}';
    }

    # SSL (uncomment when using HTTPS)
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/мастербайт.рф/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/мастербайт.рф/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
}
