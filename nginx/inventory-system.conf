# Nginx config for asset management system
# Place in /etc/nginx/sites-available/ (Ubuntu) or /etc/nginx/conf.d/
#
# ЭТОТ ФАЙЛ - ЗАПАСНОЙ ВАРИАНТ, он не участвует в docker-развёртывании.
# В штатном развёртывании nginx работает внутри контейнера papi-frontend и
# берёт настройки из frontend/nginx.conf, а сервер отдаёт только порты 80 (SPA)
# и 8080 (API). Хостовый nginx при таком раскладе нужно отключить - он занимает
# :80, и контейнеру не хватит порта (это делает update.sh).
#
# Файл пригодится, если приложение решат вернуть на запуск без Docker
# (backend под systemd) или поставить хостовый nginx терминатором TLS перед
# контейнером. Порт API ниже = API_PORT из .env (по умолчанию 8080).

server {
    listen 80;
    server_name мастербайт.рф www.мастербайт.рф;

    # Frontend root directory
    root /opt/papi/frontend/dist;
    index index.html;

    # API routes - proxy to FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # No caching for API
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Disable directory listing
    autoindex off;

    # Static assets - serve files directly, fallback to index.html for SPA routing
    # Note: $uri/ removed to avoid 403 on /assets/ (autoindex is off)
    location /assets/ {
        try_files $uri /index.html;
    }

    # SPA routing - serve index.html for all other routes
    # If file exists it is served directly, otherwise index.html for SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
